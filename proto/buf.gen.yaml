# Run from the proto/ directory: `buf generate` (or `make proto` from the repo root).
# Plugins are Go tools pinned in go.mod and executed via `go tool`.
version: v2
plugins:
  - local: [go, tool, protoc-gen-go]
    out: ../gen/go
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-go-grpc]
    out: ../gen/go
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-grpc-gateway]
    out: ../gen/go
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-openapiv2]
    out: ../gen/openapi
    # One merged spec for the whole API: gen/openapi/cargoflow.swagger.json
    strategy: all
    opt:
      - allow_merge=true
      - merge_file_name=cargoflow
      - openapi_naming_strategy=simple
